<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONSTER AI 3D - Quantum Cyber Edition</title>

<!-- Marked JS for Markdown Parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg-dark:#030509;
  --cyan:#00f0ff;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --blue:#3b82f6;
  --green:#10b981;
  --red:#f43f5e;
  --glass-bg:rgba(10, 14, 24, 0.68);
  --glass-hover:rgba(18, 24, 40, 0.85);
  --border:rgba(255, 255, 255, 0.08);
  --border-active:rgba(0, 240, 255, 0.35);
  --text-main:#f1f5f9;
  --text-muted:#64748b;
  --glow-cyan:0 0 25px rgba(0, 240, 255, 0.35);
  --glow-purple:0 0 25px rgba(139, 92, 246, 0.35);
}

html, body{
  width:100%; height:100%; margin:0; overflow:hidden;
  background:var(--bg-dark); color:var(--text-main);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body{ position:relative; }

.space{
  position:fixed; inset:0; overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.12), transparent 45%),
    var(--bg-dark);
}

.grid{
  position:absolute; width:200%; height:200%; left:-50%; top:15%;
  transform: perspective(900px) rotateX(72deg);
  background-image:
    linear-gradient(rgba(0, 240, 255, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139, 92, 246, 0.09) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  animation:gridMove 14s linear infinite;
}

@keyframes gridMove{
  from{ transform: perspective(900px) rotateX(72deg) translateY(0); }
  to{ transform: perspective(900px) rotateX(72deg) translateY(60px); }
}

.particles{ position:absolute; inset:0; pointer-events:none; }
.particle{
  position:absolute; width:var(--s); height:var(--s); border-radius:50%;
  background: radial-gradient(circle at 30% 30%, #fff 0%, var(--cyan) 40%, var(--purple) 80%, transparent 100%);
  box-shadow: 0 0 calc(var(--s)*4) var(--cyan), 0 0 calc(var(--s)*9) var(--purple);
  animation: float var(--d) ease-in-out infinite alternate, blink 2.8s ease-in-out infinite;
}

@keyframes float{ from{ transform:translate3d(0,0,0) scale(0.8); } to{ transform:translate3d(var(--x), var(--y), 0) scale(1.6); } }
@keyframes blink{ 0%,100%{ opacity:0.15; } 50%{ opacity:0.95; } }

.ui{
  position:relative; z-index:5; width:100%; height:100%; padding:16px;
  display:grid; grid-template-columns:240px minmax(0,1fr) 230px; gap:16px;
}

.glass{
  background:var(--glass-bg); border:1px solid var(--border);
  backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.08), 0 20px 50px rgba(0,0,0,0.6);
}

.sidebar{
  border-radius:24px; padding:18px; display:flex; flex-direction:column;
  transform:perspective(1000px) rotateY(2deg); transition:all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  background:rgba(8, 12, 22, 0.45); border:1px solid rgba(255,255,255,0.04);
}
.sidebar:hover{
  transform:perspective(1000px) rotateY(0deg); background:var(--glass-hover);
  border-color:var(--border-active); box-shadow:var(--glow-cyan), 0 30px 60px rgba(0,0,0,0.7);
}

.logoRow{ display:flex; align-items:center; gap:12px; margin-bottom:24px; }
.logo{
  width:44px; height:44px; display:grid; place-items:center; border-radius:14px;
  background:linear-gradient(135deg, rgba(0,240,255,0.2), rgba(139,92,246,0.2));
  border:1px solid var(--border-active); flex-shrink:0; box-shadow:var(--glow-cyan);
}
.logo img{ width:85%; height:85%; object-fit:contain; filter:drop-shadow(0 0 6px var(--cyan)); }
.logoTitle{ font-size:15px; font-weight:900; background:linear-gradient(90deg, #fff, var(--cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.logoSub{ font-size:8px; color:var(--text-muted); letter-spacing:0.18em; margin-top:3px; font-weight:700; }

.new{
  height:46px; border:1px solid var(--border-active); border-radius:14px;
  background:linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(139, 92, 246, 0.15));
  color:#fff; font-weight:800; font-size:11px; cursor:pointer; transition:all 0.25s ease;
}
.new:hover{ border-color:var(--cyan); background:linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(139, 92, 246, 0.3)); box-shadow:var(--glow-cyan); transform:translateY(-2px); }

.label{ margin:24px 8px 10px; font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.18em; font-weight:700; }

.chat{
  padding:12px; border-radius:12px; color:var(--text-muted); font-size:11px; font-weight:600;
  margin-bottom:4px; cursor:pointer; transition:all 0.2s ease; border:1px solid transparent;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chat.active{
  color:#fff; border:1px solid var(--border-active);
  background:linear-gradient(90deg, rgba(0, 240, 255, 0.12), rgba(139, 92, 246, 0.05));
  box-shadow:inset 0 0 10px rgba(0, 240, 255, 0.1);
}
.chat:hover:not(.active){ background:rgba(255,255,255,0.04); color:var(--text-main); transform:translateX(3px); }

.sidebarBottom{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); }
.sideStat{ display:flex; justify-content:space-between; font-size:9px; padding:6px 4px; color:var(--text-muted); font-weight:600; }
.sideStat strong{ color:var(--text-main); }

.center{ min-width:0; border-radius:26px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
.header{ height:70px; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; padding:0 22px; border-bottom:1px solid var(--border); background:rgba(5, 8, 16, 0.5); }
.headLeft{ display:flex; align-items:center; gap:12px; }
.mobile{ display:none; }
.title{ font-weight:900; font-size:15px; background:linear-gradient(90deg, #fff, var(--cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.online{ display:flex; align-items:center; gap:8px; color:var(--green); font-size:9px; font-weight:700; padding:6px 12px; border-radius:999px; background:rgba(16, 185, 129, 0.08); border:1px solid rgba(16, 185, 129, 0.25); }
.onlineDot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }

.headRight{ display:flex; gap:8px; }
select, .icon{ height:36px; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,0.03); color:var(--text-main); cursor:pointer; }
select{ padding:0 12px; font-size:10px; font-weight:700; outline:none; }
.icon{ width:36px; display:grid; place-items:center; font-size:13px; }

.chatArea{ flex:1; min-height:0; position:relative; }
.messages{ position:absolute; inset:0; overflow:auto; padding:35px 6vw 190px; }
.hero{ max-width:820px; margin:20px auto 40px; }
.badge{ display:inline-flex; align-items:center; gap:8px; font-size:9px; font-weight:800; color:var(--cyan); padding:6px 14px; border-radius:999px; border:1px solid var(--border-active); background:rgba(0, 240, 255, 0.06); }
.hero h1{ max-width:820px; margin:22px 0 0; font-size:clamp(36px, 4.5vw, 60px); font-weight:900; background:linear-gradient(135deg, #ffffff 30%, var(--cyan) 70%, var(--purple) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero p{ color:var(--text-muted); font-size:13px; margin-top:16px; }

.message{ max-width:840px; margin:0 auto 28px; display:flex; gap:14px; animation:fadeIn 0.3s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
.message.user{ justify-content:flex-end; }
.avatar{ width:36px; height:36px; min-width:36px; border-radius:12px; display:grid; place-items:center; font-size:9px; font-weight:900; border:1px solid var(--border); }
.aiAvatar{ color:var(--cyan); background:linear-gradient(135deg, rgba(0,240,255,0.15), rgba(139,92,246,0.15)); border-color:var(--border-active); }
.youAvatar{ background:rgba(255,255,255,0.1); color:#fff; }
.content{ max-width:min(760px, 85%); }
.messageHead{ font-size:9px; font-weight:700; color:var(--text-muted); margin:2px 0 6px; }
.bubble{ color:var(--text-main); line-height:1.75; font-size:13px; }
.user .bubble{ padding:14px 18px; border-radius:20px 6px 20px 20px; background:linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(0, 240, 255, 0.12)); border:1px solid rgba(0, 240, 255, 0.25); }
.ai .bubble{ background:rgba(12, 17, 30, 0.6); padding:16px 20px; border-radius:6px 20px 20px 20px; border:1px solid var(--border); }
.messageImg{ max-width:300px; display:block; border-radius:14px; margin-bottom:10px; border:1px solid var(--border-active); }

.copy{ opacity:0; margin-top:6px; background:none; border:1px solid var(--border); padding:4px 10px; border-radius:6px; color:var(--text-muted); font-size:9px; font-weight:700; cursor:pointer; }
.message:hover .copy{ opacity:1; }

.right{ border-radius:24px; padding:18px; background:rgba(8, 12, 22, 0.45); border:1px solid rgba(255,255,255,0.04); }
.rightTitle{ font-size:10px; font-weight:900; margin-bottom:14px; color:var(--text-muted); }
.metric{ padding:14px; margin-bottom:10px; border-radius:16px; border:1px solid var(--border); background:rgba(255,255,255,0.015); }
.metricName{ font-size:8px; color:var(--text-muted); text-transform:uppercase; font-weight:700; }
.metricValue{ margin-top:6px; font-size:18px; font-weight:900; }
.metricSub{ color:var(--text-muted); font-size:8px; margin-top:4px; }

.composerLayer{ position:absolute; z-index:20; left:0; right:0; bottom:0; padding:16px 6vw 22px; pointer-events:none; background:linear-gradient(to bottom, transparent, rgba(3,5,9,0.95) 40%, var(--bg-dark) 100%); }
.composer{ max-width:840px; margin:auto; padding:10px; border-radius:22px; pointer-events:auto; background:linear-gradient(145deg, rgba(14, 20, 34, 0.95), rgba(6, 9, 16, 0.98)); border:1px solid var(--border-active); backdrop-filter:blur(30px); }
.preview{ display:none; padding:6px; }
.previewWrap{ position:relative; display:inline-block; }
.previewImg{ width:64px; height:64px; object-fit:cover; border-radius:12px; border:1px solid var(--cyan); }
.remove{ position:absolute; right:-6px; top:-6px; width:20px; height:20px; border:0; border-radius:50%; background:var(--red); color:#fff; cursor:pointer; }
.composerMain{ display:flex; align-items:flex-end; gap:10px; }
.attach{ width:44px; height:44px; border:1px solid var(--border); border-radius:14px; background:rgba(255,255,255,0.03); color:var(--cyan); font-size:18px; cursor:pointer; display:grid; place-items:center; }
#input{ flex:1; min-height:44px; max-height:160px; resize:none; border:0; outline:0; color:#fff; background:transparent; padding:12px 6px; font-size:13px; font-family:inherit; }
.send{ min-width:86px; height:44px; border:0; border-radius:14px; color:#fff; font-size:10px; font-weight:900; cursor:pointer; background:linear-gradient(135deg, var(--cyan), var(--blue) 50%, var(--purple)); }
.send.stop{ background:linear-gradient(135deg, var(--red), #9f1239); }
.composerMeta{ display:flex; justify-content:space-between; padding:8px 6px 2px; color:var(--text-muted); font-size:8px; font-weight:700; }

@media(max-width:1100px){ .ui{ grid-template-columns:220px minmax(0,1fr); } .right{ display:none; } }
@media(max-width:750px){
  .ui{ display:block; padding:0; }
  .sidebar{ position:fixed; z-index:100; left:-280px; top:10px; bottom:10px; width:250px; }
  .sidebar.open{ left:10px; }
  .center{ width:100%; height:100%; border-radius:0; }
  .mobile{ display:block; }
  .online{ display:none; }
  .messages{ padding-left:16px; padding-right:16px; }
  .hero h1{ font-size:38px; }
}
</style>
</head>

<body>

<div class="space">
  <div class="grid"></div>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="ui">

<aside class="sidebar" id="sidebar">
  <div class="logoRow">
    <div class="logo">
      <img src="monster_logo.png.png" alt="MONSTER AI" onerror="this.style.display='none'">
    </div>
    <div>
      <div class="logoTitle">MONSTER AI</div>
      <div class="logoSub">3D AI WORKSPACE</div>
    </div>
  </div>

  <button class="new" onclick="newChat()">＋ &nbsp; New Conversation</button>

  <div class="label">Recent</div>

  <div class="sidebarBottom">
    <div class="sideStat"><span>Gateway</span><strong>ONLINE</strong></div>
    <div class="sideStat"><span>Vision</span><strong id="sideVision">READY</strong></div>
    <div class="sideStat"><span>Streaming</span><strong id="sideStreaming">ON</strong></div>
  </div>
</aside>

<main class="center glass">
  <header class="header">
    <div class="headLeft">
      <button class="icon mobile" onclick="toggleSidebar()">☰</button>
      <div class="title">MONSTER AI</div>
      <div class="online"><span class="onlineDot"></span> Gateway Online</div>
    </div>

    <div class="headRight">
      <select id="model">
        <option value="auto">Auto</option>
        <option value="fast">Fast</option>
        <option value="smart">Smart</option>
      </select>
      <button class="icon" onclick="clearChat()" title="Delete Chat">⌫</button>
    </div>
  </header>

  <section class="chatArea">
    <div class="messages" id="messages"></div>

    <div class="composerLayer">
      <div class="composer">
        <div class="preview" id="preview">
          <div class="previewWrap">
            <img id="previewImg" class="previewImg" alt="Selected image">
            <button class="remove" onclick="removeImage()">×</button>
          </div>
        </div>

        <div class="composerMain">
          <input id="file" type="file" accept="*/*" multiple hidden onchange="handleImage(event)">
          <button class="attach" onclick="document.getElementById('file').click()" title="Vision / Files">＋</button>

          <textarea id="input" rows="1" placeholder="Ask MONSTER AI anything..."></textarea>

          <button id="send" class="send" onclick="toggleSend()">Send</button>
        </div>

        <div class="composerMeta">
          <span>Enter to send · Shift + Enter newline</span>
          <span>AI ROUTING</span>
        </div>
      </div>
    </div>
  </section>
</main>

<aside class="right glass">
  <div class="rightTitle">SYSTEM TELEMETRY</div>
  <div class="metric">
    <div class="metricName">Messages</div>
    <div class="metricValue" id="count">0</div>
    <div class="metricSub">Current session</div>
  </div>
  <div class="metric">
    <div class="metricName">Gateway</div>
    <div class="metricValue" style="color:var(--green)">ONLINE</div>
    <div class="metricSub">Connected</div>
  </div>
  <div class="metric">
    <div class="metricName">Model</div>
    <div class="metricValue" style="color:var(--cyan)" id="modelText">AUTO</div>
    <div class="metricSub">Dynamic routing</div>
  </div>
</aside>

</div>

<script>
/* =========================================================
   API CONFIGURATION
========================================================= */
const API = "/api";

/* =========================================================
   DEVELOPER IDENTITY
========================================================= */
const DEVELOPER_NAME_AR = "هيثم حماتة";
const DEVELOPER_NAME_EN = "Heythem Hamata";

function isDeveloperQuestion(text){
  const value = String(text || "").toLowerCase().trim();
  const patterns = [
    /من صنعك/, /من الدي صنعك/, /من صانعك/, /من مطورك/, /من هو مطورك/,
    /شكون دارك/, /شكون صنعك/, /شكون طورك/, /شكون المبرمج ديالك/, /من برمجك/,
    /من انشاك/, /من أنشأك/, /من خلقك/, /صاحبك من/,
    /developer/, /your developer/, /who developed you/, /who created you/,
    /who made you/, /who built you/, /who is your developer/, /creator/,
    /created by/, /made by/
  ];
  return patterns.some(pattern => pattern.test(value));
}

function getDeveloperResponse(){
  return `
### MONSTER AI

أنا **MONSTER AI**، وتم تطويري بواسطة:

**${DEVELOPER_NAME_AR}**  
**${DEVELOPER_NAME_EN}**

⚡ Automation Engineer & AI Builder

أنا مصمم للعمل مع أنظمة الذكاء الاصطناعي، الأتمتة، APIs، workflows وواجهات AI الحديثة.
  `.trim();
}

/* =========================================================
   STATE MANAGEMENT
========================================================= */
let history = [];
let selectedFiles = [];
let controller = null;
let count = 0;
let currentConversationId = null;
let heroTimer = null;

/* =========================================================
   DOM ELEMENTS
========================================================= */
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const model = document.getElementById("model");
const fileInput = document.getElementById("file");

if(typeof marked !== "undefined"){
  marked.setOptions({ gfm:true, breaks:true });
}

/* =========================================================
   PARTICLES SYSTEM
========================================================= */
const particleRoot = document.getElementById("particles");
function createParticles(){
  if(!particleRoot) return;
  particleRoot.innerHTML = "";
  const particleCount = Math.min(260, Math.max(130, Math.floor(window.innerWidth / 5)));
  for(let i = 0; i < particleCount; i++){
    const p = document.createElement("div");
    p.className = "particle";
    const size = 1 + Math.random() * 4;
    const x = (Math.random() - .5) * 320;
    const y = (Math.random() - .5) * 260;
    const duration = 4 + Math.random() * 10;

    p.style.setProperty("--s", size + "px");
    p.style.setProperty("--x", x + "px");
    p.style.setProperty("--y", y + "px");
    p.style.setProperty("--d", duration + "s");

    p.style.left = Math.random() * 100 + "%";
    p.style.top = Math.random() * 100 + "%";
    p.style.animationDelay = -Math.random() * 8 + "s";
    particleRoot.appendChild(p);
  }
}
createParticles();
window.addEventListener("resize", createParticles);

/* =========================================================
   FILE & UI PREVIEW
========================================================= */
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error("Could not read file."));
    reader.readAsDataURL(file);
  });
}

async function handleImage(event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  selectedFiles = files;

  const firstImage = selectedFiles.find(file => file.type && file.type.startsWith("image/"));
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");

  if(firstImage && preview && previewImg){
    try{
      const dataURL = await fileToDataURL(firstImage);
      previewImg.src = dataURL;
      preview.style.display = "block";
    }catch(e){ console.error(e); }
  }

  const vision = document.getElementById("sideVision");
  if(vision){
    vision.textContent = "ACTIVE";
    vision.style.color = "var(--cyan)";
  }
}

function removeImage(){
  selectedFiles = [];
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");
  if(preview) preview.style.display = "none";
  if(previewImg) previewImg.src = "";
  if(fileInput) fileInput.value = "";

  const vision = document.getElementById("sideVision");
  if(vision){ vision.textContent = "READY"; vision.style.color = ""; }
}

/* =========================================================
   CHAT UI MESSAGES RENDER
========================================================= */
function createMessage(type){
  const row = document.createElement("div");
  row.className = "message " + (type === "user" ? "user" : "ai");

  const avatar = document.createElement("div");
  avatar.className = "avatar " + (type === "user" ? "youAvatar" : "aiAvatar");
  avatar.textContent = type === "user" ? "YOU" : "AI";

  const content = document.createElement("div");
  content.className = "content";

  const head = document.createElement("div");
  head.className = "messageHead";
  head.textContent = type === "user" ? "You · Now" : "MONSTER AI · AI";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const copy = document.createElement("button");
  copy.className = "copy";
  copy.textContent = "Copy";
  copy.onclick = () => copyBubble(copy);

  content.appendChild(head);
  content.appendChild(bubble);
  content.appendChild(copy);

  if(type === "user"){ row.appendChild(content); row.appendChild(avatar); }
  else{ row.appendChild(avatar); row.appendChild(content); }

  messages.appendChild(row);
  scrollBottom();
  return bubble;
}

function renderEmptyConversation(){
  messages.innerHTML = `
    <div class="hero">
      <div class="badge"><span class="onlineDot"></span> PRIVATE AI SYSTEM</div>
      <h1 id="heroTitle">I think, therefore I am.</h1>
      <p>A futuristic AI command center for your private AI workflow.</p>
    </div>
    <div class="message">
      <div class="avatar aiAvatar">AI</div>
      <div class="content">
        <div class="messageHead">MONSTER AI · Ready</div>
        <div class="bubble">Hello 👋<br><br>How can I assist you with your AI system or automation today?</div>
        <button class="copy" onclick="copyBubble(this)">Copy</button>
      </div>
    </div>
  `;
}

/* =========================================================
   SERVER CONVERSATION MANAGEMENT
========================================================= */
async function createServerConversation(){
  const res = await fetch(API + "/conversations", { method:"POST" });
  if(!res.ok) throw new Error("Could not create conversation");
  const conv = await res.json();
  currentConversationId = conv.id;
  return conv;
}

async function loadRecentConversations(){
  try{
    const res = await fetch(API + "/conversations", { method:"GET", cache:"no-store" });
    if(!res.ok) return [];
    const conversations = await res.json();
    renderRecentConversations(conversations);
    return conversations;
  }catch(e){ return []; }
}

function renderRecentConversations(conversations){
  const sidebar = document.getElementById("sidebar");
  if(!sidebar) return;
  const label = sidebar.querySelector(".label");
  if(!label) return;

  sidebar.querySelectorAll(".chat").forEach(el => el.remove());
  let last = label;

  conversations.forEach(conv => {
    const chat = document.createElement("div");
    chat.className = "chat";
    if(conv.id === currentConversationId) chat.classList.add("active");
    chat.textContent = conv.title || "New Conversation";
    chat.onclick = () => openConversation(conv.id);
    last.after(chat);
    last = chat;
  });
}

async function openConversation(id){
  if(!id) return;
  try{
    if(controller){ controller.abort(); controller = null; }
    setSendState(false);

    const res = await fetch(API + "/conversations/" + encodeURIComponent(id), { cache:"no-store" });
    if(!res.ok) return;
    const conv = await res.json();

    currentConversationId = conv.id;
    history = Array.isArray(conv.messages) ? conv.messages : [];
    count = history.length;

    updateStats();
    renderConversation();
    await loadRecentConversations();
  }catch(e){ console.error(e); }
}

function renderConversation(){
  messages.innerHTML = "";
  if(!history.length){ renderEmptyConversation(); return; }

  history.forEach(msg => {
    if(!msg || !msg.role) return;
    if(msg.role === "user"){
      const bubble = createMessage("user");
      renderUserContent(bubble, msg.content);
    } else if(msg.role === "assistant"){
      const bubble = createMessage("ai");
      const text = String(msg.content || "");
      bubble.innerHTML = typeof marked !== "undefined" ? marked.parse(text) : escapeHTML(text);
    }
  });
  scrollBottom();
}

function renderUserContent(bubble, content){
  if(Array.isArray(content)){
    content.forEach(item => {
      if(item.type === "text"){
        const el = document.createElement("div"); el.textContent = item.text; bubble.appendChild(el);
      } else if(item.type === "image_url"){
        const img = document.createElement("img"); img.src = item.image_url?.url || ""; img.className = "messageImg"; bubble.appendChild(img);
      }
    });
    return;
  }
  const el = document.createElement("div"); el.textContent = content || ""; bubble.appendChild(el);
}

/* =========================================================
   SEND MESSAGE CONTROLLER
========================================================= */
async function sendMessage(){
  const text = input.value.trim();
  const hasFiles = selectedFiles.length > 0;

  if(!text && !hasFiles) return;

  if(!currentConversationId){
    try { await createServerConversation(); } catch(e){ return; }
  }

  // Developer answer trigger
  if(isDeveloperQuestion(text) && !hasFiles){
    const userBubble = createMessage("user");
    userBubble.textContent = text;
    history.push({ role:"user", content:text });
    count++;

    input.value = "";
    removeImage();

    const response = getDeveloperResponse();
    const aiBubble = createMessage("ai");
    aiBubble.innerHTML = typeof marked !== "undefined" ? marked.parse(response) : escapeHTML(response);

    history.push({ role:"assistant", content:response });
    count++;

    updateStats();
    await saveCurrentConversation();
    return;
  }

  const userBubble = createMessage("user");
  const userContent = [];

  if(text) userContent.push({ type:"text", text:text });

  for(const file of selectedFiles){
    if(file.type && file.type.startsWith("image/")){
      const dataURL = await fileToDataURL(file);
      const img = document.createElement("img"); img.src = dataURL; img.className = "messageImg"; userBubble.appendChild(img);
      userContent.push({ type:"image_url", image_url:{ url:dataURL } });
    }
  }

  if(text){
    const textEl = document.createElement("div"); textEl.textContent = text; userBubble.appendChild(textEl);
  }

  const userPayload = userContent.length === 1 && userContent[0].type === "text" ? userContent[0].text : userContent;
  history.push({ role:"user", content:userPayload });
  count++;
  updateStats();

  input.value = "";
  removeImage();
  resizeInput();

  const aiBubble = createMessage("ai");
  aiBubble.innerHTML = `<span style="color:#718096; font-size:11px;">Thinking...</span>`;

  setSendState(true);
  controller = new AbortController();

  let answer = "";
  try{
    const res = await fetch(API + "/chat", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model: model.value,
        conversation_id: currentConversationId,
        messages: history,
        stream: true
      }),
      signal: controller.signal
    });

    if(!res.ok) throw new Error("Server error " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while(true){
      const { value, done } = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, { stream:true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for(const line of lines){
        const clean = line.trim();
        if(!clean.startsWith("data:")) continue;
        const raw = clean.slice(5).trim();
        if(raw === "[DONE]") break;

        try{
          const packet = JSON.parse(raw);
          const delta = packet?.choices?.[0]?.delta?.content;
          if(delta){
            answer += delta;
            aiBubble.innerHTML = typeof marked !== "undefined" ? marked.parse(answer) : escapeHTML(answer);
            scrollBottom();
          }
        }catch(e){}
      }
    }

    await loadRecentConversations();
  }catch(e){
    if(e.name === "AbortError") aiBubble.innerHTML = "<span style='color:#677388;'>Stopped.</span>";
    else aiBubble.innerHTML = `<span style='color:#ff687b;'>Error: ${escapeHTML(e.message)}</span>`;
  }finally{
    setSendState(false);
    controller = null;
    input.focus();
  }
}

async function saveCurrentConversation(){
  if(!currentConversationId) return;
  try{
    await fetch(API + "/conversations/" + encodeURIComponent(currentConversationId) + "/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ messages: history })
    });
    await loadRecentConversations();
  }catch(e){}
}

/* =========================================================
   HELPERS & EVENT LISTENERS
========================================================= */
function setSendState(busy){
  if(!send) return;
  if(busy){ send.textContent = "Stop"; send.classList.add("stop"); }
  else{ send.textContent = "Send"; send.classList.remove("stop"); }
}

function toggleSend(){
  if(controller){ controller.abort(); return; }
  sendMessage();
}

input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); if(!controller) sendMessage(); }
});

input.addEventListener("input", resizeInput);

function resizeInput(){
  if(!input) return;
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
}

function scrollBottom(){
  if(messages) messages.scrollTop = messages.scrollHeight;
}

async function copyBubble(btn){
  const bubble = btn.closest(".content")?.querySelector(".bubble");
  if(!bubble) return;
  try{
    await navigator.clipboard.writeText(bubble.innerText);
    btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = "Copy"; }, 1000);
  }catch(e){}
}

async function newChat(){
  if(controller){ controller.abort(); controller = null; }
  setSendState(false);
  history = []; count = 0; currentConversationId = null;
  renderEmptyConversation();
  removeImage();
  input.value = "";
  resizeInput();
  await loadRecentConversations();
  input.focus();
}

async function clearChat(){
  if(!currentConversationId){ await newChat(); return; }
  if(!confirm("Delete this conversation?")) return;
  try{
    await fetch(API + "/conversations/" + encodeURIComponent(currentConversationId), { method:"DELETE" });
    await newChat();
  }catch(e){}
}

function toggleSidebar(){
  const sb = document.getElementById("sidebar");
  if(sb) sb.classList.toggle("open");
}

function updateStats(){
  const c = document.getElementById("count"); if(c) c.textContent = count;
  const mt = document.getElementById("modelText"); if(mt && model) mt.textContent = model.value.toUpperCase();
}
if(model) model.addEventListener("change", updateStats);

function escapeHTML(str){
  const div = document.createElement("div"); div.textContent = String(str); return div.innerHTML;
}

/* =========================================================
   INITIALIZATION
========================================================= */
async function init(){
  updateStats();
  resizeInput();
  try{
    const conversations = await loadRecentConversations();
    if(conversations.length){
      await openConversation(conversations[0].id);
    } else {
      renderEmptyConversation();
    }
  }catch(e){ renderEmptyConversation(); }
  input.focus();
}

init();
</script>
