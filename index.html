function getRandomItem(list){

  return list[
    Math.floor(
      Math.random() * list.length
    )
  ];
}


function detectHeroCategory(text){

  const value =
    String(text || "")
      .toLowerCase();

  if(selectedImage){
    return "image";
  }

  if(
    /n8n|automation|webhook|workflow|zapier|make\.com/
      .test(value)
  ){

    return "automation";
  }

  if(
    /code|javascript|python|html|css|api|json|bug|function|script|node/
      .test(value)
  ){

    return "code";
  }

  if(
    /gold|xau|forex|trade|trading|market|buy|sell|signal|tp|sl/
      .test(value)
  ){

    return "trading";
  }

  if(
    /\?|how |why |what |when |where |can |could |should |help/
      .test(value)
  ){

    return "question";
  }

  return "default";
}

async function createServerConversation(){

  const response =
    await fetch(
      API + "/conversations",
      {
        method: "POST"
      }
    );

  if(!response.ok){

    const errorText =
      await response.text();

    throw new Error(
      errorText ||
      "Could not create conversation."
    );
  }

  const conversation =
    await response.json();

  currentConversationId =
    conversation.id;

  return conversation;
}


async function saveCurrentConversation(){

  if(!currentConversationId){
    return false;
  }

  try{

    const response =
      await fetch(
        API +
        "/conversations/" +
        encodeURIComponent(
          currentConversationId
        ) +
        "/messages",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            messages: history
          })
        }
      );

    if(!response.ok){

      console.error(
        "Conversation save failed:",
        await response.text()
      );

      return false;
    }

    await loadRecentConversations();

    return true;

  }catch(error){

    console.error(
      "Conversation save error:",
      error
    );

    return false;
  }
}

async function loadRecentConversations(){

  try{

    const response =
      await fetch(
        API + "/conversations",
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if(!response.ok){

      console.error(
        "Recent load failed:",
        await response.text()
      );

      return;
    }

    const conversations =
      await response.json();

    renderRecentConversations(
      Array.isArray(conversations)
        ? conversations
        : []
    );

  }catch(error){

    console.error(
      "Recent conversations error:",
      error
    );
  }
}


/* =========================================================
   RENDER RECENT
========================================================= */

function renderRecentConversations(
  conversations
){

  const sidebar =
    document.getElementById(
      "sidebar"
    );

  if(!sidebar){
    return;
  }

  const label =
    sidebar.querySelector(
      ".label"
    );

  if(!label){
    return;
  }


  /*
     Remove the old hard-coded
     Recent items from the HTML.
  */

  sidebar
    .querySelectorAll(
      ".chat"
    )
    .forEach(chat => {

      chat.remove();

    });


  /*
     Render only real conversations.
  */

  let insertAfter =
    label;


  conversations.forEach(
    conversation => {

      const chat =
        document.createElement(
          "div"
        );

      chat.className =
        "chat dynamic-chat";

      chat.dataset.id =
        conversation.id;

      chat.title =
        conversation.title ||
        "New Conversation";

      chat.textContent =
        conversation.title ||
        "New Conversation";


      if(
        conversation.id ===
        currentConversationId
      ){

        chat.classList.add(
          "active"
        );
      }


      chat.addEventListener(
        "click",
        () => {

          openConversation(
            conversation.id
          );

        }
      );


      insertAfter.after(
        chat
      );

      insertAfter =
        chat;
    }
  );
}

async function openConversation(
  conversationId
){

  if(!conversationId){
    return;
  }

  try{

    /*
       Stop current generation.
    */

    if(controller){

      controller.abort();

      controller = null;
    }


    const response =
      await fetch(
        API +
        "/conversations/" +
        encodeURIComponent(
          conversationId
        ),
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );
    }


    const conversation =
      await response.json();


    currentConversationId =
      conversation.id;


    history =
      Array.isArray(
        conversation.messages
      )
        ? conversation.messages
        : [];


    count =
      history.length;


    updateStats();


    renderConversation();


    await loadRecentConversations();


    input.focus();

  }catch(error){

    console.error(
      "Open conversation error:",
      error
    );
  }
}


/* =========================================================
   RENDER FULL CONVERSATION
========================================================= */

function renderConversation(){

  messages.innerHTML = "";


  if(!history.length){

    renderEmptyConversation();

    return;
  }


  history.forEach(
    message => {

      if(
        message.role === "user"
      ){

        const bubble =
          createMessage("user");

        renderUserContent(
          bubble,
          message.content
        );

      }

      else if(
        message.role === "assistant"
      ){

        const bubble =
          createMessage("ai");

        bubble.innerHTML =
          marked.parse(
            String(
              message.content ||
              ""
            )
          );
      }

    }
  );


  scrollBottom();
}


function renderUserContent(
  bubble,
  content
){

  if(
    Array.isArray(content)
  ){

    const textParts = [];


    content.forEach(
      item => {

        if(
          !item ||
          typeof item !== "object"
        ){
          return;
        }


        if(
          item.type === "text"
        ){

          textParts.push(
            item.text || ""
          );

        }


        else if(
          item.type ===
          "image_url"
        ){

          const img =
            document.createElement(
              "img"
            );

          img.src =
            item.image_url?.url ||
            "";

          img.className =
            "messageImg";

          img.alt =
            "Conversation image";

          bubble.appendChild(
            img
          );
        }

      }
    );


    if(textParts.length){

      const textEl =
        document.createElement(
          "div"
        );

      textEl.textContent =
        textParts.join(
          "\n"
        );

      bubble.appendChild(
        textEl
      );
    }

    return;
  }


  const textEl =
    document.createElement(
      "div"
    );

  textEl.textContent =
    content || "";

  bubble.appendChild(
    textEl
  );
}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();

  const hadImage =
    Boolean(selectedImage);


  /*
     Nothing to send.
  */

  if(
    !text &&
    !hadImage
  ){

    return;
  }


  /*
     Create a conversation ONLY
     when the user actually sends
     the first message.
  */

  if(!currentConversationId){

    try{

      await createServerConversation();

    }catch(error){

      console.error(
        "Conversation creation error:",
        error
      );

      alert(
        "Could not create conversation."
      );

      return;
    }

  }


  updateHero(
    text,
    false
  );


  /*
     USER MESSAGE UI
  */

  const user =
    createMessage("user");


  if(hadImage){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      selectedImage;

    img.className =
      "messageImg";

    img.alt =
      "Selected image";

    user.appendChild(img);
  }


  if(text){

    const textEl =
      document.createElement(
        "div"
      );

    textEl.textContent =
      text;

    user.appendChild(textEl);
  }


  /*
     LOCAL DEVELOPER QUESTION
  */

  if(
    !hadImage &&
    isDeveloperQuestion(text)
  ){

    history.push({
      role: "user",
      content: text
    });

    count++;

    updateStats();

    input.value = "";

    resizeInput();

    await handleLocalDeveloperResponse();

    input.focus();

    return;
  }


  /*
     STREAMING UI
  */

  send.textContent =
    "Stop";

  send.classList.add(
    "stop"
  );


  const streaming =
    document.getElementById(
      "sideStreaming"
    );


  if(streaming){

    streaming.textContent =
      "ACTIVE";

    streaming.style.color =
      "var(--purple)";
  }


  if(hadImage){

    const vision =
      document.getElementById(
        "sideVision"
      );

    if(vision){

      vision.textContent =
        "ACTIVE";

      vision.style.color =
        "var(--cyan)";
    }
  }


  /*
     BUILD USER HISTORY
  */

  let userHistoryMessage;


  if(hadImage){

    userHistoryMessage = {

      role: "user",

      content: [

        {
          type: "text",

          text:
            text ||
            "Analyze this image."
        },

        {
          type: "image_url",

          image_url: {
            url:
              selectedImage
          }
        }

      ]

    };

  }else{

    userHistoryMessage = {

      role: "user",

      content: text

    };
  }


  history.push(
    userHistoryMessage
  );


  count++;

  updateStats();


  /*
     COPY HISTORY FOR OMNIROUTE
  */

  const payload =
    JSON.parse(
      JSON.stringify(
        history
      )
    );


  /*
     CLEAR IMAGE/INPUT
  */

  removeImage();

  input.value = "";

  resizeInput();


  /*
     AI MESSAGE
  */

  const ai =
    createMessage("ai");


  ai.innerHTML = `

    <span
      style="
        color:#718096;
        font-size:11px;
      "
    >

      Thinking

      <span>●</span>
      <span>●</span>
      <span>●</span>

    </span>

  `;


  controller =
    new AbortController();


  try{

    /*
       IMPORTANT:
       Send conversation_id.
       This keeps the new message
       in the SAME conversation.
    */

    const response =
      await fetch(
        API + "/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            model:
              model.value,

            conversation_id:
              currentConversationId,

            messages:
              payload,

            stream:
              true
          }),

          signal:
            controller.signal
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        `HTTP ${response.status}`
      );
    }


    if(!response.body){

      throw new Error(
        "Streaming response is unavailable."
      );
    }


    /*
       Streaming reader.
    */

    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let buffer = "";

    let answer = "";


    while(true){

      const {
        value,
        done
      } =
        await reader.read();


      if(done){

        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      const lines =
        buffer.split(
          "\n"
        );


      buffer =
        lines.pop() || "";


      for(
        const line of lines
      ){

        const clean =
          line.trim();


        if(
          !clean ||
          !clean.startsWith(
            "data:"
          )
        ){

          continue;
        }


        const raw =
          clean
            .slice(5)
            .trim();


        if(
          raw === "[DONE]"
        ){

          continue;
        }


        try{

          const json =
            JSON.parse(raw);


          const delta =
            json
              ?.choices?.[0]
              ?.delta
              ?.content;


          if(delta){

            answer +=
              delta;


            ai.innerHTML =
              marked.parse(
                answer
              );


            scrollBottom();
          }


        }catch(error){

          /*
             Ignore incomplete SSE.
          */

        }

      }

    }


    /*
       Flush final chunk.
    */

    const finalLine =
      buffer.trim();


    if(
      finalLine &&
      finalLine.startsWith(
        "data:"
      )
    ){

      const raw =
        finalLine
          .slice(5)
          .trim();


      if(
        raw &&
        raw !== "[DONE]"
      ){

        try{

          const json =
            JSON.parse(
              raw
            );


          const delta =
            json
              ?.choices?.[0]
              ?.delta
              ?.content;


          if(delta){

            answer +=
              delta;


            ai.innerHTML =
              marked.parse(
                answer
              );


            scrollBottom();
          }


        }catch(error){

          /*
             Ignore malformed
             final chunk.
          */

        }

      }

    }


    /*
       Save assistant answer
       in frontend history.
    */

    history.push({

      role:
        "assistant",

      content:
        answer
    });


    count++;

    updateStats();


    /*
       Save full conversation
       to server.
    */

    await saveCurrentConversation();


  }catch(error){

    if(
      error.name ===
      "AbortError"
    ){

      ai.innerHTML = `

        <span
          style="
            color:#677388;
          "
        >

          Generation stopped.

        </span>

      `;


      /*
         If anything was generated
         before Stop, save it.
      */

      if(answer.trim()){

        history.push({

          role:
            "assistant",

          content:
            answer
        });

        count++;

        updateStats();

        await saveCurrentConversation();
      }


    }else{

      ai.innerHTML = `

        <span
          style="
            color:#ff687b;
          "
        >

          <strong>
            ERROR
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </span>

      `;
    }


  }finally{

    send.textContent =
      "Send";

    send.classList.remove(
      "stop"
    );


    controller = null;


    if(streaming){

      streaming.textContent =
        "ON";

      streaming.style.color =
        "";
    }


    input.focus();
  }
}

async function copyBubble(button){

  const bubble =
    button
      .closest(".content")
      ?.querySelector(".bubble");


  if(!bubble){
    return;
  }


  try{

    await navigator.clipboard.writeText(
      bubble.innerText
    );


    button.textContent =
      "Copied";


    setTimeout(
      () => {

        button.textContent =
          "Copy";

      },
      1000
    );


  }catch(error){

    console.error(
      "Clipboard error:",
      error
    );
  }
}


/* =========================================================
   NEW CHAT
========================================================= */

async function newChat(){

  /*
     Stop active generation.
  */

  if(controller){

    controller.abort();

    controller = null;
  }


  /*
     IMPORTANT:
     Do NOT delete old conversations.
     Just start a fresh local state.
     The server conversation will be
     created when the user sends the
     first message.
  */

  history = [];

  count = 0;

  currentConversationId =
    null;


  updateStats();


  removeImage();


  renderEmptyConversation();


  const streaming =
    document.getElementById(
      "sideStreaming"
    );


  if(streaming){

    streaming.textContent =
      "ON";

    streaming.style.color =
      "";
  }


  input.value = "";

  resizeInput();


  await loadRecentConversations();


  input.focus();
}


/* =========================================================
   CLEAR / DELETE CURRENT CHAT
========================================================= */

async function clearChat(){

  /*
     Nothing is selected.
     Just prepare a fresh chat.
  */

  if(
    !currentConversationId
  ){

    await newChat();

    return;
  }


  if(
    !confirm(
      "Delete this conversation?"
    )
  ){

    return;
  }


  try{

    const response =
      await fetch(
        API +
        "/conversations/" +
        encodeURIComponent(
          currentConversationId
        ),
        {
          method:
            "DELETE"
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Could not delete conversation."
      );
    }


    currentConversationId =
      null;

    history = [];

    count = 0;


    updateStats();


    renderEmptyConversation();


    await loadRecentConversations();


    input.focus();


  }catch(error){

    console.error(
      "Delete conversation error:",
      error
    );


    alert(
      "Could not delete conversation."
    );
  }
}

function updateStats(){

    document.getElementById(

    );


  if(countElement){

    countElement.textContent =
      count;
  }


  const modelText =
    document.getElementById(

    );

    model
  ){

    modelText.textContent =
      model.value.toUpperCase();
  }
}


model.addEventListener(

);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  const el =
    document.createElement(
      "div"
    );

  el.textContent =
    String(value);

  return el.innerHTML;
}


/* =========================================================
   INIT
========================================================= */

async function init(){

  updateStats();

  resizeInput();


  /*
     Load all saved conversations
     from server/database file.
  */

  await loadRecentConversations();


  /*
     Start with a blank screen,
     without creating an empty
     server conversation.
  */

  currentConversationId =
    null;

  history = [];

  count = 0;

  input.focus();
}


init();
